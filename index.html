<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>crowbro.dev</title>
    <meta name="description" content="A crow on a wire at dusk. Games live here soon." />
    <meta name="theme-color" content="#1b1838" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="scene" aria-label="A crow perched on a telephone wire at dusk">
      <!-- The sky: stars, the moon, and hills along the horizon. -->
      <div class="stars" aria-hidden="true"></div>
      <div class="moon" aria-hidden="true"></div>
      <svg class="hills" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true">
        <path class="far" d="M0 140 C 180 90 300 120 460 100 C 640 78 760 130 940 108 C 1120 86 1260 120 1440 96 V220 H0 Z" />
        <path class="near" d="M0 180 C 220 150 380 170 560 158 C 760 145 900 182 1100 166 C 1260 154 1360 170 1440 162 V220 H0 Z" />
      </svg>

      <!-- Asteroids streaking across the top of the sky, one for each game on the way.
           asteroids.js flies them. Give one a data-href and a click goes there; until then it says "soon!".
           data-dir: 1 flies left to right, -1 right to left. data-lane: height, as a share of the screen.
           data-cross: seconds to cross the screen. data-start: where it starts, as a share of the width. -->
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <defs>
          <radialGradient id="rockfill" cx="0.72" cy="0.22" r="0.95">
            <stop offset="0" stop-color="#a39cba" />
            <stop offset="0.45" stop-color="#5b5476" />
            <stop offset="1" stop-color="#211d33" />
          </radialGradient>
          <linearGradient id="rockrim" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffeccc" stop-opacity="0.7" />
            <stop offset="0.45" stop-color="#ffeccc" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="tailouter">
            <stop offset="0" stop-color="#ff6f8e" stop-opacity="0" />
            <stop offset="1" stop-color="#ff8a70" stop-opacity="0.5" />
          </linearGradient>
          <linearGradient id="tailmid">
            <stop offset="0" stop-color="#ffa86b" stop-opacity="0" />
            <stop offset="1" stop-color="#ffc07a" stop-opacity="0.85" />
          </linearGradient>
          <linearGradient id="tailcore">
            <stop offset="0" stop-color="#fff3d0" stop-opacity="0" />
            <stop offset="1" stop-color="#fff8e6" stop-opacity="0.95" />
          </linearGradient>
        </defs>
      </svg>
      <div class="asteroids">
        <button class="roid" type="button" data-href="https://idlesuits.crowbro.dev" data-dir="1" data-lane="0.14" data-cross="30" data-start="0.28" aria-label="Play IdleSuits">
          <span class="trail" aria-hidden="true">
            <svg viewBox="0 0 300 100" preserveAspectRatio="none">
              <path fill="url(#tailouter)" d="M0 50 C 120 40 200 10 262 8 C 290 8 300 30 300 50 C 300 70 290 92 262 92 C 200 90 120 60 0 50 Z" />
              <path fill="url(#tailmid)" d="M30 50 C 140 44 220 22 268 22 C 290 22 298 36 298 50 C 298 64 290 78 268 78 C 220 78 140 56 30 50 Z" />
              <path fill="url(#tailcore)" d="M110 50 C 190 46 240 35 276 35 C 290 35 296 42 296 50 C 296 58 290 65 276 65 C 240 65 190 54 110 50 Z" />
            </svg>
          </span>
          <span class="rock">
            <svg viewBox="0 0 220 140" aria-hidden="true">
              <path class="stone" d="M28 44 C 40 22 50 20 62 18 C 90 12 130 10 158 14 C 186 18 204 34 208 56 C 214 82 204 104 186 116 C 162 132 128 134 100 130 C 70 136 36 128 20 106 C 8 88 14 62 28 44 Z" />
              <g class="craters">
                <ellipse cx="44" cy="62" rx="11" ry="8" />
                <ellipse cx="184" cy="96" rx="9" ry="6" />
                <ellipse cx="72" cy="116" rx="7" ry="4.5" />
                <ellipse cx="190" cy="50" rx="5" ry="3.5" />
              </g>
            </svg>
            <span class="name">IdleSuits</span>
          </span>
          <span class="tag" aria-hidden="true">soon!</span>
        </button>
        <button class="roid" type="button" data-href="https://pixel-taker.crowbro.dev" data-dir="-1" data-lane="0.32" data-cross="38" data-start="0.64" aria-label="Play Pixel-Taker">
          <span class="trail" aria-hidden="true">
            <svg viewBox="0 0 300 100" preserveAspectRatio="none">
              <path fill="url(#tailouter)" d="M0 50 C 120 40 200 10 262 8 C 290 8 300 30 300 50 C 300 70 290 92 262 92 C 200 90 120 60 0 50 Z" />
              <path fill="url(#tailmid)" d="M30 50 C 140 44 220 22 268 22 C 290 22 298 36 298 50 C 298 64 290 78 268 78 C 220 78 140 56 30 50 Z" />
              <path fill="url(#tailcore)" d="M110 50 C 190 46 240 35 276 35 C 290 35 296 42 296 50 C 296 58 290 65 276 65 C 240 65 190 54 110 50 Z" />
            </svg>
          </span>
          <span class="rock">
            <svg viewBox="0 0 220 140" aria-hidden="true">
              <path class="stone" d="M18 56 C 24 32 44 20 62 18 C 84 14 110 22 128 16 C 140 12 150 13 158 14 C 182 16 206 30 210 58 C 214 80 212 98 196 112 C 178 128 150 128 126 134 C 96 140 56 132 34 118 C 12 104 12 76 18 56 Z" />
              <g class="craters">
                <ellipse cx="38" cy="96" rx="10" ry="7" />
                <ellipse cx="190" cy="74" rx="8" ry="11" />
                <ellipse cx="150" cy="120" rx="6" ry="4" />
                <ellipse cx="34" cy="58" rx="4.5" ry="3.5" />
              </g>
            </svg>
            <span class="name">Pixel-Taker</span>
          </span>
          <span class="tag" aria-hidden="true">soon!</span>
        </button>
      </div>

      <!-- The wire, slung between two poles; it sways a little when the crow lands or leaves. -->
      <svg class="wire" viewBox="0 0 1000 120" preserveAspectRatio="none" aria-hidden="true">
        <path id="wire-path" d="M-20 30 Q 500 110 1020 30" />
      </svg>

      <!-- The crow. Click or tap it and it goes for a fly. -->
      <button class="crow" type="button" aria-label="The crow. Tap it to send it flying.">
        <span class="bubble" aria-hidden="true">caw!</span>
        <svg viewBox="0 0 220 200" aria-hidden="true">
          <defs>
            <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2c3150" />
              <stop offset="0.45" stop-color="#14141d" />
              <stop offset="1" stop-color="#0b0b12" />
            </linearGradient>
            <linearGradient id="wingsheen" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#363d63" />
              <stop offset="1" stop-color="#15151f" />
            </linearGradient>
          </defs>
          <g class="body-group">
            <path class="tail" d="M64 112 L 8 150 L 22 158 L 18 168 L 78 128 Z" fill="#101018" />
            <g class="legs" stroke="#2b2b33" stroke-width="4" stroke-linecap="round" fill="none">
              <path d="M104 136 L 100 158 M 100 158 L 92 163 M 100 158 L 108 164" />
              <path d="M122 134 L 122 158 M 122 158 L 114 163 M 122 158 L 130 164" />
            </g>
            <path class="body" d="M60 112 C 58 74 120 58 152 84 C 170 100 160 132 124 140 C 96 146 64 138 60 112 Z" fill="url(#sheen)" />
            <g class="wing">
              <path d="M78 96 C 100 78 142 82 154 100 C 138 116 102 128 66 132 C 70 118 70 106 78 96 Z" fill="url(#wingsheen)" />
              <path d="M84 108 C 102 104 120 104 138 106 M 80 118 C 98 116 116 116 132 114" stroke="#4a5280" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
            </g>
            <g class="head">
              <circle cx="158" cy="70" r="24" fill="url(#sheen)" />
              <path class="beak-top" d="M176 64 C 190 62 202 68 210 75 L 178 77 Z" fill="#33343f" />
              <path class="beak-low" d="M178 77 L 206 77 C 198 83 188 85 178 83 Z" fill="#26262f" />
              <circle class="eye-white" cx="166" cy="63" r="6" fill="#f4efe2" />
              <circle class="pupil" cx="168" cy="63" r="3.2" fill="#0b0b12" />
              <circle cx="169.5" cy="61.5" r="1.1" fill="#fff" />
              <rect class="lid" x="159" y="56" width="14" height="14" rx="7" fill="#17171f" />
            </g>
          </g>
        </svg>
      </button>

      <header class="title">
        <h1>crowbro<span>.dev</span></h1>
        <p>games &amp; odd little projects · soon</p>
      </header>
    </main>
    <script src="crow.js" defer></script>
    <script src="asteroids.js" defer></script>
  </body>
</html>
